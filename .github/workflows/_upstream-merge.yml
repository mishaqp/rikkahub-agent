name: _upstream merge probe
on:
  push:
    branches: [update/upstream-2.5.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/upstream-2.5.1
          fetch-depth: 0
      - name: Merge upstream 2.5.1 and report conflicts
        shell: bash
        run: |
          set +e
          git config user.name "probe"
          git config user.email "probe@example.com"
          git config merge.conflictStyle diff3
          git remote add upstream https://github.com/rikkahub/rikkahub.git
          git fetch --no-tags upstream 2.5.1
          echo "HEAD:           $(git rev-parse HEAD)"
          echo "upstream/2.5.1: $(git rev-parse upstream/2.5.1)"
          echo "merge-base:     $(git merge-base HEAD upstream/2.5.1)"
          git merge --no-ff --no-commit upstream/2.5.1
          echo "RESULT_CODE: $?"
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          echo "=== CONFLICTED FILES ($(wc -l < /tmp/conflicts.txt)) ==="
          cat /tmp/conflicts.txt
          echo "=== LOCAL CHANGES NOT YET MERGED: $(git diff --name-only HEAD | wc -l) ==="
          echo "=== UPSTREAM AHEAD: $(git rev-list --count HEAD..upstream/2.5.1) ==="
          mkdir -p /tmp/conf
          while IFS= read -r f; do [ -n "$f" ] && mkdir -p "/tmp/conf/$(dirname "$f")" && cp "$f" "/tmp/conf/$f" 2>/dev/null; done < /tmp/conflicts.txt
          find /tmp/conf -type f | sed 's|/tmp/conf/||'
          exit 0
      - name: Upload conflicted files (with markers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conflicted-files
          path: /tmp/conf
          if-no-files-found: ignore
