name: _upstream merge probe
on:
  push:
    branches: [update/upstream-2.5.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/upstream-2.5.1
          fetch-depth: 0
      - name: Merge upstream 2.5.1 and export merge result
        shell: bash
        run: |
          set +e
          git config user.name "probe"
          git config user.email "probe@example.com"
          git config merge.conflictStyle diff3
          git remote add upstream https://github.com/rikkahub/rikkahub.git
          git fetch --no-tags upstream refs/tags/2.5.1:refs/remotes/upstream/2.5.1
          UP=$(git rev-parse refs/remotes/upstream/2.5.1)
          echo "HEAD:           $(git rev-parse HEAD)"
          echo "upstream:       $UP"
          echo "merge-base:     $(git merge-base HEAD $UP)"
          git merge --no-ff --no-commit $UP
          echo "RESULT_CODE: $?"
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          git diff --name-only HEAD > /tmp/changed.txt
          echo "=== CONFLICTED ($(wc -l < /tmp/conflicts.txt)) ==="
          cat /tmp/conflicts.txt
          echo "=== CHANGED BY MERGE ($(wc -l < /tmp/changed.txt)) ==="
          cat /tmp/changed.txt
          mkdir -p /tmp/out
          cp /tmp/conflicts.txt /tmp/changed.txt /tmp/out/
          tar -czf /tmp/out/merge-result.tar.gz -T /tmp/changed.txt 2>/dev/null
          exit 0
      - name: Upload merge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-result
          path: /tmp/out
          if-no-files-found: error

  schema:
    if: contains(github.event.head_commit.message, '[schema]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/upstream-2.5.1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Export Room schema (31.json)
        run: |
          ./gradlew :app:kspReleaseKotlin -Parm64Only=true --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
          || ./gradlew :app:assembleRelease -Parm64Only=true --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: List generated schemas
        run: ls -la app/schemas/me.rerere.rikkahub.data.db.AppDatabase/ | tail -6
      - uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/me.rerere.rikkahub.data.db.AppDatabase/*.json
          if-no-files-found: error

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/upstream-2.5.1
          fetch-depth: 1
      - name: Fork guards
        shell: bash
        run: |
          set +e
          echo "=== 1. llama / GGUF scan over the whole tree ==="
          hits=$(grep -rniE "llama|gguf" --exclude-dir=.git . | head -40)
          if [ -z "$hits" ]; then echo "<no matches at all>"; else echo "$hits"; fi
          echo "match lines: $(printf '%s' "$hits" | grep -c .)"
          echo
          echo "=== 2. .gitmodules ==="
          cat .gitmodules
          echo "submodule entries: $(grep -c '^\[submodule' .gitmodules)"
          echo
          echo "=== 3. identity: applicationId / namespace / versions ==="
          grep -nE 'applicationId|namespace|versionCode =|versionName =' app/build.gradle.kts | head -6
          echo
          echo "=== 4. Room version + latest schema ==="
          grep -n "^    version = " app/src/main/java/me/rerere/rikkahub/data/db/AppDatabase.kt
          ls app/schemas/me.rerere.rikkahub.data.db.AppDatabase/ | sort -n | tail -3
          echo
          echo "=== 5. upstream 2.5.1 merged in? ==="
          git remote add upstream https://github.com/rikkahub/rikkahub.git 2>/dev/null
          git fetch --no-tags upstream refs/tags/2.5.1:refs/remotes/upstream/2.5.1 >/dev/null 2>&1
          if git merge-base --is-ancestor refs/remotes/upstream/2.5.1 HEAD; then echo "YES: upstream a9b35ba2 is an ancestor of HEAD"; else echo "NO"; fi
          exit 0
