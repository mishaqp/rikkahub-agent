name: _verify 2.5.1 (non-publishing)
# Temporary branch-only gate used while the 2.5.1 port is under review: it fails fast on the
# repository-level regressions that the port could introduce. The heavy checks (lint, arm64
# build, APK/certificate/URL verification, emulator migrations) now live in the permanent ci.yml
# and run on this pull request. Delete this file once ci.yml is green on master.
on:
  push:
    branches: [update/upstream-2.5.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-2.5.1
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Guards
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          note() { echo "::error::$1"; fail=1; }

          echo "=== 1. no source may point at the parent repository ==="
          hits=$(grep -rn "ExTV/rikkahub-agent" app/src ai/src local-llm/src workspace/src web-ui 2>/dev/null || true)
          if [ -n "$hits" ]; then note "ExTV/rikkahub-agent referenced in sources"; echo "$hits"; fi
          unexpected=$(grep -n "ExTV/rikkahub-agent" app/build.gradle.kts | grep -v 'check(!updateApiUrl' || true)
          if [ -n "$unexpected" ]; then note "unexpected ExTV/rikkahub-agent reference in app/build.gradle.kts"; echo "$unexpected"; fi

          echo "=== 2. the update URL must point at this fork ==="
          grep -q 'const val LATEST_URL = "https://api.github.com/repos/mishaqp/rikkahub-agent/releases/latest"' \
            app/src/main/java/me/rerere/rikkahub/reliability/GitHubReleaseChecker.kt \
            || note "GitHubReleaseChecker.LATEST_URL does not point at mishaqp/rikkahub-agent"
          grep -q 'val forkReleaseUrl = "https://api.github.com/repos/mishaqp/rikkahub-agent/releases/latest"' \
            app/build.gradle.kts \
            || note "app/build.gradle.kts has no mishaqp fallback URL"

          echo "=== 3. the Room chain must contain 23 -> 24 and 30 -> 31 ==="
          grep -q "AutoMigration(from = 23, to = 24)" app/src/main/java/me/rerere/rikkahub/data/db/AppDatabase.kt \
            || note "AutoMigration(23, 24) is missing"
          grep -q "AutoMigration(from = 30, to = 31)" app/src/main/java/me/rerere/rikkahub/data/db/AppDatabase.kt \
            || note "AutoMigration(30, 31) is missing"
          grep -q "^    version = 31," app/src/main/java/me/rerere/rikkahub/data/db/AppDatabase.kt \
            || note "AppDatabase version = 31 is missing or mis-indented"

          echo "=== 4. upstream 2.5.1 must be an ancestor of HEAD ==="
          git remote add upstream https://github.com/rikkahub/rikkahub.git 2>/dev/null || true
          git fetch --no-tags upstream refs/tags/2.5.1:refs/remotes/upstream/2.5.1 >/dev/null 2>&1 || true
          if git merge-base --is-ancestor refs/remotes/upstream/2.5.1 HEAD; then
            echo "OK: a9b35ba2 is an ancestor of HEAD"
          else
            note "upstream 2.5.1 is not an ancestor of HEAD"
          fi

          echo "=== 5. single-source versionCode ==="
          code="$(bash .github/scripts/version-code.sh)" || note "version-code.sh failed"
          echo "computed VERSION_CODE: ${code:-<none>}"

          echo "=== 6. no llama.cpp / GGUF and a single submodule ==="
          # Deliberately narrow, and sources only: "llama" alone matches the Ollama search
          # provider and the llama emoji, while fixture data (base64 trace blobs) contains the
          # letters "gguf" by chance. Only real llama.cpp/GGUF artefacts may count as a regression.
          llama=$(grep -rniE "gguf|llama[-_ ]?cpp|libllama|llama\\.h" \
            --include="*.kt" --include="*.kts" --include="*.java" \
            --include="*.c" --include="*.cc" --include="*.cpp" --include="*.h" --include="*.hpp" \
            --include="*.cmake" --include="CMakeLists.txt" --include="*.toml" --include="*.pro" \
            app/src ai/src local-llm/src workspace/src 2>/dev/null \
            | grep -vi "ollama" | cut -c1-200 | head -20 || true)
          if [ -n "$llama" ]; then note "llama.cpp/GGUF references found"; echo "$llama"; fi
          subs=$(grep -c '^\[submodule' .gitmodules || true)
          [ "$subs" = "1" ] || note "expected exactly one submodule, found $subs"

          if [ "$fail" -ne 0 ]; then echo "static checks failed"; exit 1; fi
          echo "all static checks passed"
