name: Apply CI release hardening

on:
  push:
    branches:
      - port/extv-2.5.1-agent-fixes
    paths:
      - .github/workflows/apply-ci-release-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port/extv-2.5.1-agent-fixes
          fetch-depth: 0
          submodules: recursive

      - name: Normalize strict hardening script patterns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-ci-release-hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '''    "org.gradle.configuration-cache=true\\n",
              "org.gradle.configuration-cache=true\\norg.gradle.caching=true\\n",'''
          new = '''    "org.gradle.configuration-cache=true",
              "org.gradle.configuration-cache=true\\norg.gradle.caching=true",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one gradle pattern block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply checked CI/release transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-ci-release-hardening.py

      - name: Commit hardening and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/scripts/apply-ci-release-hardening.py
          git rm .github/workflows/apply-ci-release-hardening.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: harden build and release workflows"
          git push origin HEAD:port/extv-2.5.1-agent-fixes
