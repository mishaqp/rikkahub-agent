name: Apply device control composite

on:
  push:
    branches:
      - refactor/device-control-composite
    paths:
      - .github/workflows/apply-device-control.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/device-control-composite
          fetch-depth: 0

      - name: Apply device control patch
        run: python .github/scripts/apply-device-control.py

      - name: Validate patch
        run: |
          git diff --check
          test -f app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/DeviceControlTool.kt
          test -f app/src/test/java/me/rerere/rikkahub/data/ai/tools/local/DeviceControlToolTest.kt
          grep -q 'name = "device_control"' app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/DeviceControlTool.kt
          grep -q '"set_torch" to CompatibilityRule("device_control"' app/src/main/java/me/rerere/rikkahub/data/ai/tools/ToolNameAliases.kt

      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/workflows/apply-device-control.yml .github/scripts/apply-device-control.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(tools): add device control composite"
          git push origin HEAD:refactor/device-control-composite
