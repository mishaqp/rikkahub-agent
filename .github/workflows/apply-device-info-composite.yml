name: Apply device_info composite patch

on:
  push:
    branches: [refactor/device-info-composite]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/device-info-composite
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/scripts/apply-device-info.py
      - name: Remove one-shot files and commit
        shell: bash
        run: |
          rm .github/workflows/apply-device-info-composite.yml
          rm .github/scripts/apply-device-info.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(tools): fold device info reads into composite tool'
          git push origin HEAD:refactor/device-info-composite
