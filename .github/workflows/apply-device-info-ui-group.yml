name: Apply device info UI grouping

on:
  push:
    branches: [ui/group-device-info-tools]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/group-device-info-tools
          fetch-depth: 0
      - name: Group Device Info toggles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/assistant/detail/AssistantLocalToolPage.kt')
          text = path.read_text()

          state_anchor = '''    var keyboardDialogShownThisVisit by remember { mutableStateOf(false) }\n\n    val cronHintText ='''
          state_replacement = '''    var keyboardDialogShownThisVisit by remember { mutableStateOf(false) }\n    var deviceInfoExpanded by remember { mutableStateOf(false) }\n    val deviceInfoOptions = remember {\n        setOf(\n            LocalToolOption.Battery,\n            LocalToolOption.AudioInfo,\n            LocalToolOption.TelephonyInfo,\n            LocalToolOption.WifiInfo,\n            LocalToolOption.StorageInfo,\n            LocalToolOption.Sensors,\n        )\n    }\n    val enabledDeviceInfoCount = deviceInfoOptions.count { it in assistant.localTools }\n\n    val cronHintText ='''
          if text.count(state_anchor) != 1:
              raise SystemExit(f'state anchor count={text.count(state_anchor)}')
          text = text.replace(state_anchor, state_replacement, 1)

          start_marker = '        // Device info section\n'
          output_marker = '        // Output section\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('device info section marker not found')
          output = text.find(output_marker, start)
          if output < 0:
              raise SystemExit('output section marker not found')

          old_block = text[start:output]
          card_marker = '        CardGroup {\n'
          card_start = old_block.find(card_marker)
          if card_start < 0:
              raise SystemExit('device info CardGroup not found')
          body_with_close = old_block[card_start + len(card_marker):]
          close = '        }\n\n'
          if not body_with_close.endswith(close):
              raise SystemExit('unexpected device info CardGroup ending')
          child_items = body_with_close[:-len(close)]
          indented_children = ''.join(
              ('    ' + line if line.strip() else line)
              for line in child_items.splitlines(keepends=True)
          )

          new_block = '''        // The model sees one device_info composite schema, while the UI keeps the\n        // six granular permission toggles behind one expandable visual group.\n        CardGroup {\n            item(\n                onClick = { deviceInfoExpanded = !deviceInfoExpanded },\n                headlineContent = {\n                    Text(stringResource(R.string.assistant_page_local_tools_section_device_info))\n                },\n                trailingContent = {\n                    Text(\n                        "$enabledDeviceInfoCount/${deviceInfoOptions.size}  " +\n                            if (deviceInfoExpanded) "▲" else "▼"\n                    )\n                },\n            )\n            if (deviceInfoExpanded) {\n''' + indented_children + '''            }\n        }\n\n'''

          text = text[:start] + new_block + text[output:]
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-device-info-ui-group.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ui(tools): group device info toggles'
          git push origin HEAD:ui/group-device-info-tools
