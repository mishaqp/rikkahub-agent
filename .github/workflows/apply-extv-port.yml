name: Apply selected ExTV port

on:
  push:
    branches:
      - port/extv-2.5.1-agent-fixes
    paths:
      - .github/workflows/apply-extv-port.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port/extv-2.5.1-agent-fixes
          fetch-depth: 0
          submodules: recursive

      - name: Disambiguate list-only replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-extv-port.py')
          text = p.read_text(encoding='utf-8')
          old = '''replace_once(
              "workspace/src/main/java/me/rerere/workspace/WorkspaceFileSystem.kt",
              "            .take(config.maxListEntries)\\n",
              "            .take(limit)\\n",
          )'''
          new = '''replace_once(
              "workspace/src/main/java/me/rerere/workspace/WorkspaceFileSystem.kt",
              "            .sortedWith(compareBy<File> { !it.isDirectory }.thenBy { it.name.lowercase() })\\n            .take(config.maxListEntries)\\n            .map { it.toEntry(root) }\\n",
              "            .sortedWith(compareBy<File> { !it.isDirectory }.thenBy { it.name.lowercase() })\\n            .take(limit)\\n            .map { it.toEntry(root) }\\n",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one script block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply checked source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-extv-port.py

      - name: Commit selected fixes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-extv-port.py
          git rm .github/patches/extv-2.5.1-agent-selected.patch
          git rm .github/workflows/apply-extv-port.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "port: selected ExTV 2.5.1 agent fixes"
          git push origin HEAD:port/extv-2.5.1-agent-fixes
