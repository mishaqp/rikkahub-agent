name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests + web typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On pull_request the default ref is the temporary merge commit, which has a different
          # commit count than the branch head. Check out the real head SHA so VERSION_CODE and the
          # built artifacts describe exactly the commit under review.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compute VERSION_CODE
        run: |
          CODE="$(bash .github/scripts/version-code.sh)"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Run AI, LiteRT and app unit tests
        run: >-
          ./gradlew
          :ai:testDebugUnitTest
          :local-llm:testDebugUnitTest
          :app:testDebugUnitTest
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Web UI typecheck
        working-directory: web-ui
        run: pnpm typecheck

  build-release:
    name: Lint, build and verify APK + AAB (arm64)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compute VERSION_CODE
        run: |
          CODE="$(bash .github/scripts/version-code.sh)"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure release signing if secrets available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing: secrets not configured, building unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing: using repository secrets" >> $GITHUB_STEP_SUMMARY
      - name: Lint and build arm64 release APK + AAB
        timeout-minutes: 75
        run: >-
          ./gradlew
          :app:lintRelease
          :app:assembleRelease
          :app:bundleRelease
          -Parm64Only=true
          --no-daemon --no-parallel --max-workers=1 --console=plain
          -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"
      - name: Verify APK (identity, signature and update URL)
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)

          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | grep -E "^package:|^native-code:"
          if grep -q "testOnly=.true." /tmp/badging.txt; then echo "::error::APK is testOnly"; exit 1; fi
          grep -q "package: name='me.mishaqp.rikkahub'" /tmp/badging.txt || { echo "::error::unexpected package name"; exit 1; }
          EXPECTED_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$EXPECTED_NAME" ] || { echo "::error::could not read versionName from app/build.gradle.kts"; exit 1; }
          echo "versionName: expected=$EXPECTED_NAME"
          grep -Fq "versionName='$EXPECTED_NAME'" /tmp/badging.txt || { echo "::error::unexpected versionName"; exit 1; }
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt || { echo "::error::unexpected ABI set"; exit 1; }
          EXPECTED_CODE="${VERSION_CODE:?VERSION_CODE is not set}"
          ACTUAL_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt | head -1)
          echo "versionCode: actual=$ACTUAL_CODE computed=$EXPECTED_CODE"
          [ "$ACTUAL_CODE" = "$EXPECTED_CODE" ] || { echo "::error::APK versionCode $ACTUAL_CODE != computed $EXPECTED_CODE"; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED_CERT=973f6443a15702066b0e97ff807dca2009461e1f3523cfa4d92d073a2fdccd4d
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "cert sha256: $ACTUAL_CERT"
          [ "$ACTUAL_CERT" = "$EXPECTED_CERT" ] || { echo "::error::unexpected signing certificate"; exit 1; }

          APK_PATH="$APK" python3 - <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(os.environ["APK_PATH"])
          bad = good = 0
          urls = set()
          for name in z.namelist():
              if not name.endswith(".dex"):
                  continue
              data = z.read(name)
              bad += data.count(b"ExTV/rikkahub-agent")
              good += data.count(b"mishaqp/rikkahub-agent")
              for m in re.finditer(rb"https?://[ -~]{5,140}", data):
                  url = m.group().decode("ascii", "replace")
                  if "rikkahub-agent" in url:
                      urls.add(url)
          print("ExTV/rikkahub-agent occurrences:", bad)
          print("mishaqp/rikkahub-agent occurrences:", good)
          for url in sorted(urls):
              print("   URL:", url)
          if bad:
              sys.exit("FAIL: the APK still points at ExTV/rikkahub-agent")
          if not good:
              sys.exit("FAIL: mishaqp/rikkahub-agent is missing from the APK")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  room-migration-tests:
    name: Room migration tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compute VERSION_CODE
        run: |
          CODE="$(bash .github/scripts/version-code.sh)"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.data.db.AppDatabaseMigrationTest
            --no-daemon --max-workers=2
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-migration-results
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
