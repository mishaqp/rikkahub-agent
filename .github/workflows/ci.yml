name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run AI, LiteRT and app unit tests
        run: >-
          ./gradlew
          :ai:testDebugUnitTest
          :local-llm:testDebugUnitTest
          :app:testDebugUnitTest
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
