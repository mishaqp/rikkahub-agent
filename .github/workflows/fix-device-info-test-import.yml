name: Fix device_info test import
on:
  push:
    branches: [refactor/device-info-composite]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/device-info-composite
          fetch-depth: 0
      - name: Add missing jsonPrimitive import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/me/rerere/rikkahub/data/ai/tools/ToolNameAliasesTest.kt')
          s = p.read_text()
          old = 'import kotlinx.serialization.json.jsonObject\n'
          new = old + 'import kotlinx.serialization.json.jsonPrimitive\n'
          if s.count(old) != 1:
              raise SystemExit('jsonObject import not unique')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-device-info-test-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(tools): fix device info alias assertions'
          git push origin HEAD:refactor/device-info-composite
