name: Build arm64 debug APK
on:
  push:
    branches: [update/upstream-2.5.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-2.5.0-arm64-debug
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-2.5.0-agent-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
