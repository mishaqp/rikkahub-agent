name: Build arm64 debug APK
on:
  push:
    branches: [update/upstream-2.5.0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-2.5.0-arm64-debug
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure persistent debug signing
        shell: bash
        run: |
          base64 -d .github/debug-signing.p12.b64 > "$RUNNER_TEMP/debug-signing.p12"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/debug-signing.p12" \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' > local.properties
      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a -Parm64Only=true -Pandroid.injected.testOnly=false --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Stage the single arm64 debug APK
        shell: bash
        run: |
          mapfile -t apks < <(find . -type f -name '*.apk' -print)
          printf 'APK: %s\n' "${apks[@]}"
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi
          mkdir -p artifact
          cp "${apks[0]}" artifact/rikkahub-2.5.0-agent-arm64-v8a-debug.apk
      - name: Verify APK is not test-only
        shell: bash
        run: |
          aapt2_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$aapt2_path" dump badging artifact/rikkahub-2.5.0-agent-arm64-v8a-debug.apk | tee apk-badging.txt
          if grep -q "testOnly=.true." apk-badging.txt; then
            echo "::error::APK is still marked test-only"
            exit 1
          fi
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-2.5.0-agent-arm64-v8a-debug
          path: artifact/rikkahub-2.5.0-agent-arm64-v8a-debug.apk
          if-no-files-found: error
