name: Inspect lint findings
on:
  push:
    branches: [update/upstream-2.5.0]
    paths: [.github/workflows/lint-findings.yml]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verification-reports
          run-id: 34176701690
          github-token: ${{ github.token }}
          path: reports
      - name: Summarize lint and tests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E, collections, json
          for p in pathlib.Path("reports").rglob("lint-results-release.xml"):
              errors = [x for x in E.parse(p).getroot().findall("issue") if x.get("severity") in ("Error", "Fatal")]
              print("COUNTS="+json.dumps(dict(collections.Counter(x.get("id") for x in errors))))
              for x in errors:
                  print("FINDING="+json.dumps({"id":x.get("id"),"message":x.get("message"),"locations":[l.attrib for l in x.findall("location")]}))
          roots=[E.parse(p).getroot() for p in pathlib.Path("reports").rglob("TEST-*.xml")]
          print("TESTS="+json.dumps({k:sum(int(r.get(k,"0")) for r in roots) for k in ["tests","failures","errors","skipped"]}))
          PY
