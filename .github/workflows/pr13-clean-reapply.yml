name: PR13 clean call-level reapply

on:
  push:
    branches:
      - refactor/tool-name-compat-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-reapply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean name-only PR13 sources
        run: |
          git checkout 3222a19094d7ab94c825dc953dec215aa846d111 -- \
            app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/CronJobTool.kt \
            app/src/main/java/me/rerere/rikkahub/service/DirectModeActionRunner.kt \
            app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt \
            app/src/main/java/me/rerere/rikkahub/workflow/model/WorkflowJson.kt

      - name: Reapply only call-level compatibility changes
        run: python3 .github/scripts/pr13-clean-reapply.py

      - name: Verify patch scope and syntax whitespace
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt\napp/src/main/java/me/rerere/rikkahub/data/ai/tools/local/CronJobTool.kt\napp/src/main/java/me/rerere/rikkahub/service/DirectModeActionRunner.kt\napp/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt\napp/src/main/java/me/rerere/rikkahub/workflow/model/WorkflowJson.kt'
          test "$changed" = "$expected"

      - name: Commit clean reapply
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt \
            app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/CronJobTool.kt \
            app/src/main/java/me/rerere/rikkahub/service/DirectModeActionRunner.kt \
            app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt \
            app/src/main/java/me/rerere/rikkahub/workflow/model/WorkflowJson.kt
          git commit -m "refactor(tools): cleanly reapply call-level compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}
