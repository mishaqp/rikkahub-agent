name: release-once-agent2

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/release-once-agent2.yml'

permissions:
  contents: write

concurrency:
  group: release-once-agent2
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Record source commit
        run: git rev-parse HEAD | tee BUILD_COMMIT.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4

      - name: Compute VERSION_CODE
        run: |
          CODE="$(bash .github/scripts/version-code.sh)"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Read release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionName = "([^"]+)"', source)
          if not match:
              raise SystemExit('versionName not found')
          version = match.group(1)
          if version != '2.5.1-agent.2':
              raise SystemExit(f'unexpected versionName: {version}')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('RELEASE_TAG=v' + version + '\n')
          PY

      - name: Refuse an existing release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Release tag ${RELEASE_TAG} already exists"
            exit 1
          fi

      - name: Verify versionCode is newer than latest published APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$LATEST_TAG" --pattern '*.apk' --dir "$RUNNER_TEMP/previous-release"
          PREV_APK=$(find "$RUNNER_TEMP/previous-release" -maxdepth 1 -name '*.apk' | head -1)
          [ -n "$PREV_APK" ] || { echo "::error::latest release has no APK"; exit 1; }
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          PREV_CODE=$("$AAPT2" dump badging "$PREV_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          echo "versionCode: new=$VERSION_CODE previous=$PREV_CODE ($LATEST_TAG)"
          [ "$VERSION_CODE" -gt "$PREV_CODE" ] || { echo "::error::versionCode did not increase"; exit 1; }

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo "::error::release signing secrets missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Lint and build arm64 release APK + AAB
        timeout-minutes: 70
        run: ./gradlew :app:lintRelease :app:assembleRelease :app:bundleRelease -Parm64Only=true --no-daemon --no-parallel --max-workers=1 --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"

      - name: Web typecheck
        working-directory: web-ui
        run: pnpm typecheck

      - name: Verify APK before publishing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | grep -E "^package:|^native-code:"
          grep -q "package: name='me.mishaqp.rikkahub'" /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt
          ! grep -q "testOnly=.true." /tmp/badging.txt
          ACTUAL_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt | head -1)
          [ "$ACTUAL_CODE" = "$VERSION_CODE" ]
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED_CERT=973f6443a15702066b0e97ff807dca2009461e1f3523cfa4d92d073a2fdccd4d
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          [ "$ACTUAL_CERT" = "$EXPECTED_CERT" ]

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-2.5.1-agent.2-apk
          path: |
            app/build/outputs/apk/release/*.apk
            BUILD_COMMIT.txt
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-2.5.1-agent.2-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: rikkahub ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
