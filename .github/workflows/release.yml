name: release
# Manual-only publishing. There is deliberately no `push` trigger: a merge to master must never
# publish or overwrite a GitHub Release by itself. Dispatch this workflow from master by hand,
# after CI is green on the commit and the APK has been installed and checked on a real device.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Publishing is a master-only action.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode is `git rev-list --count HEAD`.
          fetch-depth: 0
          submodules: recursive
      - name: Record source commit
        run: git rev-parse HEAD | tee BUILD_COMMIT.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Compute VERSION_CODE
        run: |
          CODE="$(bash .github/scripts/version-code.sh)"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
      - name: Configure release signing (requires secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets not configured. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to repository secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing: using repository secrets" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Release lint (fixed memory)
        timeout-minutes: 30
        run: ./gradlew :app:lintRelease -Parm64Only=true --no-daemon --no-parallel --max-workers=1 --console=plain --info --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"
      - name: Build arm64 release APK
        timeout-minutes: 25
        run: ./gradlew :app:assembleRelease -Parm64Only=true --no-daemon --no-parallel --max-workers=2 --console=plain --info --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Build arm64 release AAB
        timeout-minutes: 25
        run: ./gradlew :app:bundleRelease -Parm64Only=true --no-daemon --no-parallel --max-workers=2 --console=plain --info --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Web typecheck
        working-directory: web-ui
        run: pnpm typecheck
      - name: Verify APK before publishing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)

          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | grep -E "^package:|^native-code:"
          if grep -q "testOnly=.true." /tmp/badging.txt; then echo "::error::APK is testOnly"; exit 1; fi
          grep -q "package: name='me.mishaqp.rikkahub'" /tmp/badging.txt || { echo "::error::unexpected package name"; exit 1; }
          grep -q "native-code: 'arm64-v8a'" /tmp/badging.txt || { echo "::error::unexpected ABI set"; exit 1; }
          EXPECTED_CODE="${VERSION_CODE:?VERSION_CODE is not set}"
          ACTUAL_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" /tmp/badging.txt | head -1)
          echo "versionCode: actual=$ACTUAL_CODE computed=$EXPECTED_CODE"
          [ "$ACTUAL_CODE" = "$EXPECTED_CODE" ] || { echo "::error::APK versionCode $ACTUAL_CODE != computed $EXPECTED_CODE"; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          EXPECTED_CERT=973f6443a15702066b0e97ff807dca2009461e1f3523cfa4d92d073a2fdccd4d
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          [ "$ACTUAL_CERT" = "$EXPECTED_CERT" ] || { echo "::error::unexpected signing certificate"; exit 1; }

          APK_PATH="$APK" python3 - <<'PY'
          import os, re, sys, zipfile
          z = zipfile.ZipFile(os.environ["APK_PATH"])
          bad = good = 0
          for name in z.namelist():
              if not name.endswith(".dex"):
                  continue
              data = z.read(name)
              bad += data.count(b"ExTV/rikkahub-agent")
              good += data.count(b"mishaqp/rikkahub-agent")
          print("ExTV/rikkahub-agent occurrences:", bad)
          print("mishaqp/rikkahub-agent occurrences:", good)
          if bad:
              sys.exit("FAIL: the APK still points at ExTV/rikkahub-agent")
          if not good:
              sys.exit("FAIL: mishaqp/rikkahub-agent is missing from the APK")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            BUILD_COMMIT.txt
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            app/build/reports/lint-results*
            BUILD_COMMIT.txt
      - name: Read release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName = "([^"]+)"', source).group(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("RELEASE_TAG=v" + version + "\n")
          PY
      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: rikkahub ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
