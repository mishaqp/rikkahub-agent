name: release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        run: npm install --global pnpm@10

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias rikkahub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass RikkaHubFork2026 -keypass RikkaHubFork2026 \
            -dname "CN=RikkaHub Fork, OU=Agent, O=mishaqp, C=RU"
          printf 'storeFile=%s\nstorePassword=RikkaHubFork2026\nkeyAlias=rikkahub\nkeyPassword=RikkaHubFork2026\n' "$RUNNER_TEMP/release.keystore" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.16-fork
          name: rikkahub v2.4.16-fork
          body: |
            Автосборка личного форка (mishaqp/rikkahub-agent).
            - Пакет: me.mishaqp.rikkahub (ставится рядом с оригиналом и форком ExTV)
            - Имя: rikkahub
          files: dist/*.apk
